# Staging configuration — full feature surface enabled.
#
# Exercises every optional subsystem (hierarchy, reservoir, Kuramoto,
# thermodynamics, active inference) so release candidates hit the code paths
# that the minimal core loop never reaches.

[apgi]
seed = 12345
strict = true

theta_0 = 0.55
theta_base = 0.55
pi_min = 0.1
pi_max = 10.0

dt = 0.5
tau_s = 5.0
lam = 0.09516258196404048

psi_type = "tanh"
gamma_psi = 2.0
history_maxlen = 1000000
stochastic_ignition = true

# --- Optional subsystems, all on ---
use_hierarchical = true
hierarchical_mode = "full"
use_reservoir = true
reservoir_spectral_radius = 0.9   # canonical [0.7, 0.95]
use_kuramoto = true
use_thermodynamic_cost = true
use_observable_mapping = true
use_active_inference = true

# kappa_meta converts the Landauer energy floor into AU. The default 1e20 makes
# that floor (~kappa_meta * N_erase * k_B*T*ln2 ~ 5.9 AU) DOMINATE the
# signal-proportional cost c1*S (~0.2 AU), so eta*[C-V] ratchets theta into its
# clip ceiling and the reservoir/oscillator machinery never gets exercised.
# 1e18 keeps Landauer as a genuine consistency FLOOR — which is all the spec
# claims for it ("a thermodynamic consistency floor... not a predictive
# constraint on metabolic cost") — while leaving the allostatic term in charge.
kappa_meta = 1e18
