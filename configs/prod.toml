# Publication / release configuration.
#
# Every value here is inside the Notation Appendix canonical ranges. Runs made
# with this file are the ones whose figures appear in the APGI paper series.

[apgi]
# Fixed seed: published figures must be regenerable bit-for-bit.
seed = 20260729

# Fail closed. A spec violation aborts rather than producing a
# plausible-looking but non-conformant result.
strict = true

# --- Canonical core parameters (Notation Appendix, Canonical Parameters) ---
theta_0 = 0.55      # canonical [0.25, 0.85] AU
theta_base = 0.55
pi_min = 0.1        # MathSpec §2 precision clamp
pi_max = 10.0
tau_sigma = 0.5     # gamma_sig = 1/tau_sigma = 2.0, canonical [2, 7.5]
ignite_tau = 0.5
beta_sm = 0.3       # canonical [0.1, 1.2], waking sub-band [0.3, 0.8]

# --- Integration (MathSpec §7.4: dt <= min(tau)/10) ---
dt = 0.5
tau_s = 5.0
lam = 0.09516258196404048  # = 1 - exp(-dt/tau_S), the exact relation

# --- Canonical saturating psi (MathSpec §2) ---
psi_type = "tanh"
gamma_psi = 2.0

# Bounded history keeps long runs from exhausting memory.
history_maxlen = 1000000

# Stochastic ignition on, so the Bernoulli sampling path is exercised.
stochastic_ignition = true
